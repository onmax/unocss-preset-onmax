<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fluid Sizing - New Utilities Test</title>
  </head>

  <body>
    <!-- Scroll padding utilities -->
    <section id="scroll-padding">
      <div class="f-scroll-p-min-10 f-scroll-p-max-20" scroll-p-min-10="" scroll-p-max-20=""></div>
      <div class="f-scroll-px-min-10 f-scroll-px-max-20" scroll-px-min-10="" scroll-px-max-20=""></div>
      <div class="f-scroll-py-min-10 f-scroll-py-max-20" scroll-py-min-10="" scroll-py-max-20=""></div>
      <div class="f-scroll-pt-min-10 f-scroll-pt-max-20 f-scroll-pb-min-10 f-scroll-pb-max-20 f-scroll-pl-min-10 f-scroll-pl-max-20 f-scroll-pr-min-10 f-scroll-pr-max-20" scroll-pt-min-10="" scroll-pt-max-20="" scroll-pb-min-10="" scroll-pb-max-20="" scroll-pl-min-10="" scroll-pl-max-20="" scroll-pr-min-10="" scroll-pr-max-20=""></div>
    </section>

    <!-- Scroll margin utilities -->
    <section id="scroll-margin">
      <div class="f-scroll-m-min-10 f-scroll-m-max-20" scroll-m-min-10="" scroll-m-max-20=""></div>
      <div class="f-scroll-mx-min-10 f-scroll-mx-max-20" scroll-mx-min-10="" scroll-mx-max-20=""></div>
      <div class="f-scroll-my-min-10 f-scroll-my-max-20" scroll-my-min-10="" scroll-my-max-20=""></div>
      <div class="f-scroll-mt-min-10 f-scroll-mt-max-20 f-scroll-mb-min-10 f-scroll-mb-max-20 f-scroll-ml-min-10 f-scroll-ml-max-20 f-scroll-mr-min-10 f-scroll-mr-max-20" scroll-mt-min-10="" scroll-mt-max-20="" scroll-mb-min-10="" scroll-mb-max-20="" scroll-ml-min-10="" scroll-ml-max-20="" scroll-mr-min-10="" scroll-mr-max-20=""></div>
    </section>

    <!-- Border width utilities -->
    <section id="border-width">
      <div class="f-border-min-1 f-border-max-4" border-min-1="" border-max-4=""></div>
      <div class="f-border-x-min-1 f-border-x-max-4" border-x-min-1="" border-x-max-4=""></div>
      <div class="f-border-y-min-1 f-border-y-max-4" border-y-min-1="" border-y-max-4=""></div>
      <div class="f-border-t-min-1 f-border-t-max-4 f-border-b-min-1 f-border-b-max-4 f-border-l-min-1 f-border-l-max-4 f-border-r-min-1 f-border-r-max-4" border-t-min-1="" border-t-max-4="" border-b-min-1="" border-b-max-4="" border-l-min-1="" border-l-max-4="" border-r-min-1="" border-r-max-4=""></div>
    </section>

    <!-- Outline utilities -->
    <section id="outline">
      <div class="f-outline-min-1 f-outline-max-4" outline-min-1="" outline-max-4=""></div>
      <div class="f-outline-offset-min-2 f-outline-offset-max-8" outline-offset-min-2="" outline-offset-max-8=""></div>
    </section>

    <!-- Inset utilities (positioning) -->
    <section id="inset">
      <div class="f-inset-min-0 f-inset-max-100" inset-min-0="" inset-max-100=""></div>
      <div class="f-inset-x-min-0 f-inset-x-max-100" inset-x-min-0="" inset-x-max-100=""></div>
      <div class="f-inset-y-min-0 f-inset-y-max-100" inset-y-min-0="" inset-y-max-100=""></div>
    </section>

    <!-- Space utilities -->
    <section id="space">
      <div class="f-space-x-min-4 f-space-x-max-12" space-x-min-4="" space-x-max-12=""></div>
      <div class="f-space-y-min-4 f-space-y-max-12" space-y-min-4="" space-y-max-12=""></div>
      <div class="f-space-x-4/12"><span>A</span><span>B</span></div>
      <div class="f-space-y-8/16"><div>A</div><div>B</div></div>
    </section>

    <!-- Filter utilities -->
    <section id="filter">
      <div class="f-blur-min-2 f-blur-max-8" blur-min-2="" blur-max-8=""></div>
      <div class="f-backdrop-blur-min-2 f-backdrop-blur-max-8" backdrop-blur-min-2="" backdrop-blur-max-8=""></div>
    </section>

    <!-- Layout utilities -->
    <section id="layout">
      <div class="f-basis-min-100 f-basis-max-300" basis-min-100="" basis-max-300=""></div>
      <div class="f-indent-min-4 f-indent-max-12" indent-min-4="" indent-max-12=""></div>
    </section>

    <!-- Column utilities -->
    <section id="columns">
      <div class="f-column-gap-min-4 f-column-gap-max-12" column-gap-min-4="" column-gap-max-12=""></div>
    </section>

    <!-- Theme shortcuts with new utilities -->
    <section id="theme-shortcuts">
      <div class="f-scroll-p-xs f-scroll-p-sm f-scroll-p-md f-scroll-p-lg f-scroll-p-xl" scroll-p-xs="" scroll-p-sm="" scroll-p-md="" scroll-p-lg="" scroll-p-xl=""></div>
      <div class="f-border-xs f-border-sm f-border-md f-border-lg f-border-xl" border-xs="" border-sm="" border-md="" border-lg="" border-xl=""></div>
    </section>

    <!-- Direct min/max combinations -->
    <section id="direct-combinations">
      <div class="f-scroll-p-10/20"></div>
      <div class="f-border-1/4"></div>
      <div class="f-outline-2/4"></div>
      <div class="f-inset-0/100"></div>
    </section>

    <!-- Complex combinations -->
    <section id="complex-combinations">
      <div class="f-scroll-p-md f-border-sm f-outline-lg f-inset-x-md" scroll-p-md="" border-sm="" outline-lg="" inset-x-md=""></div>
      <div class="f-scroll-p-10/20 f-border-1/4 f-inset-0/100"></div>
    </section>
  </body>
</html>
